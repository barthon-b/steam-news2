[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steam-news2"
version = "0.1.0"
description = "Retrieve and read Steam news for games you follow"
authors = [
  {name = "Bartosz Bednarowicz", email = "barthazar@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["requests>=2.32"]

[project.scripts]
steam-news2 = "steam_news2.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
